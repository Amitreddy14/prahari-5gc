[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "prahari-attacks"
version = "0.2.0"
description = "Attack injector for the Prahari-5GC testbed (lab use only: refuses any target outside 172.22.0.0/24)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Amit Reddy" }]
dependencies = [
    "h2>=4.1,<5",
    "pycrate>=0.7",   # NGAP (TS 38.413) and NAS 5GS (TS 24.501) encoding, N2 attacks
    "pysctp>=0.7",    # SCTP transport for NGAP (N2); needs libsctp at runtime
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.scripts]
prahari-attack = "prahari_attacks.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/prahari_attacks"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "SIM", "RUF", "PL", "PT"]
ignore = ["PLR2004", "PLR0913"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603", "S311"]  # asserts; probe binary; seeded RNG in fuzz tests

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["prahari_attacks"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["h2.*", "hpack.*", "sctp.*", "pycrate_asn1dir.*", "pycrate_mobile.*"]
ignore_missing_imports = true
