name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends shellcheck clang-format-18
      - name: shellcheck
        run: shellcheck scripts/*.sh
      - name: clang-format
        run: find probe \( -name '*.cpp' -o -name '*.hpp' \) -print0 | xargs -0 clang-format-18 --dry-run --Werror

  probe:
    name: probe (${{ matrix.name }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: gcc-debug,   preset: debug }
          - { name: gcc-release, preset: release }
          - { name: clang-asan,  preset: asan, tidy: true }
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build libgtest-dev libpcap-dev libnghttp2-dev librdkafka-dev \
            clang-18 clang-tidy-18 libclang-rt-18-dev
      - name: Configure
        working-directory: probe
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        working-directory: probe
        run: cmake --build --preset ${{ matrix.preset }} --parallel
      - name: Test
        working-directory: probe
        run: ctest --preset ${{ matrix.preset }}
      - name: clang-tidy
        if: matrix.tidy
        working-directory: probe
        run: clang-tidy-18 -p build/${{ matrix.preset }} src/*.cpp

  fuzz-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build clang-18 libclang-rt-18-dev
      - name: Build fuzzers
        working-directory: probe
        run: cmake --preset fuzz && cmake --build --preset fuzz
      - name: Fuzz PFCP decoder (60 s)
        working-directory: probe
        run: |
          mkdir -p build/fuzz/corpus && cp fuzz/corpus/pfcp/* build/fuzz/corpus/
          ./build/fuzz/fuzz_pfcp -max_total_time=60 build/fuzz/corpus

  analytics:
    name: analytics (py${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: analytics
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: analytics/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest
