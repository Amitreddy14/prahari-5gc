name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends shellcheck clang-format-18
      - name: shellcheck
        run: shellcheck scripts/*.sh testbed/scripts/*.sh testbed/docker/*.sh
      - name: clang-format
        run: find probe \( -name '*.cpp' -o -name '*.hpp' \) -print0 | xargs -0 clang-format-18 --dry-run --Werror

  probe:
    name: probe (${{ matrix.name }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: gcc-debug,   preset: debug }
          - { name: gcc-release, preset: release }
          - { name: clang-asan,  preset: asan, tidy: true }
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build libgtest-dev libpcap-dev libssl-dev libnghttp2-dev librdkafka-dev \
            clang-18 clang-tidy-18 libclang-rt-18-dev
      - name: Configure
        working-directory: probe
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        working-directory: probe
        run: cmake --build --preset ${{ matrix.preset }} --parallel
      - name: Test
        working-directory: probe
        run: ctest --preset ${{ matrix.preset }}
      - name: clang-tidy
        if: matrix.tidy
        working-directory: probe
        run: clang-tidy-18 -p build/${{ matrix.preset }} src/*.cpp

  fuzz-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build clang-18 libclang-rt-18-dev
      - name: Install libpcap, OpenSSL, nghttp2, librdkafka
        run: sudo apt-get install -y --no-install-recommends libpcap-dev libssl-dev libnghttp2-dev librdkafka-dev
      - name: Build fuzzers
        working-directory: probe
        run: cmake --preset fuzz && cmake --build --preset fuzz
      - name: Fuzz each decoder (30 s each)
        working-directory: probe
        run: |
          for f in pfcp pfcp_ie frame ngap nas http2 sbi sbi_flow; do
            mkdir -p "build/fuzz/corpus-$f" && cp fuzz/corpus/$f/* "build/fuzz/corpus-$f/"
            ./build/fuzz/fuzz_$f -max_total_time=30 "build/fuzz/corpus-$f"
          done

  probe-contract:
    # The real probe binary against a real capture: tshark field-by-field, and the
    # Python models + JSON Schema on every emitted event.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          echo "wireshark-common wireshark-common/install-setuid boolean false" | sudo debconf-set-selections
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ninja-build libgtest-dev libpcap-dev libssl-dev libnghttp2-dev librdkafka-dev \
            libsctp-dev tshark
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build probe (release)
        working-directory: probe
        run: cmake --preset release && cmake --build --preset release --parallel
      - name: Cross-check against tshark
        run: |
          python3 probe/tools/crosscheck_tshark.py --probe probe/build/release/prahari-probe \
            probe/tests/data/n4-lifecycle.pcap probe/tests/data/n2-registration.pcap \
            probe/tests/data/sbi-registration.pcap
      - name: Benchmark (informational)
        run: |
          probe/build/release/prahari-probe bench --pcap probe/tests/data/n4-lifecycle.pcap --repeat 20000
          probe/build/release/prahari-probe bench --pcap probe/tests/data/n2-registration.pcap --repeat 20000
          probe/build/release/prahari-probe bench --pcap probe/tests/data/sbi-registration.pcap --repeat 300
      - name: Probe output satisfies the Python contract
        working-directory: analytics
        env:
          PRAHARI_PROBE_BIN: ${{ github.workspace }}/probe/build/release/prahari-probe
        run: pip install -e ".[dev]" && pytest -rs tests/test_probe_output.py
      - name: Injector's PFCP/NGAP/NAS messages decode in the C++ probe
        working-directory: attacks
        env:
          PRAHARI_PROBE_BIN: ${{ github.workspace }}/probe/build/release/prahari-probe
        run: |
          pip install -e ".[dev]"
          pytest -rs tests/test_pfcp.py tests/test_ngap.py tests/test_nas.py

  attacks:
    # The injector: lint, strict types, tests (allowlist, PFCP/NGAP/NAS encoders, h2c, CLI).
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: attacks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: attacks/pyproject.toml
      - name: Install libsctp (pysctp builds its extension against it)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libsctp-dev
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest

  campaign:
    # The campaign runner: benign traffic generator + attack timeline orchestration.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: campaign
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: campaign/pyproject.toml
      - run: pip install -e ".[dev,yaml]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest

  analytics:
    name: analytics (py${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: analytics
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: analytics/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest

  testbed-config:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Compose file is valid
        working-directory: testbed
        run: cp .env.example .env && docker compose config -q && docker compose --profile attack config -q
      - name: NF and UERANSIM configs are valid YAML
        run: |
          python3 -c "import sys, yaml; [yaml.safe_load(open(f)) for f in sys.argv[1:]]; print(len(sys.argv) - 1, 'files ok')" \
            testbed/open5gs/*.yaml testbed/ueransim/gnb.yaml testbed/ueransim/ue.yaml.tmpl
      - name: Provisioning script parses
        run: node --check testbed/provision/provision.js

  testbed-e2e:
    # Builds Open5GS + UERANSIM from source and runs the full smoke test.
    needs: testbed-config
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Load SCTP kernel module
        run: sudo modprobe sctp && lsmod | grep -q sctp
      - name: Host preflight
        run: bash scripts/check-host.sh
      - name: Build images
        working-directory: testbed
        run: |
          cp .env.example .env
          sed -i 's/^PRAHARI_UE_COUNT=.*/PRAHARI_UE_COUNT=3/' .env
          sed -i "s/^PRAHARI_SUPI_KEY=.*/PRAHARI_SUPI_KEY=$(openssl rand -hex 32)/" .env
          docker compose build
      - name: Start testbed
        working-directory: testbed
        run: docker compose up -d
      - name: Smoke test
        run: bash testbed/scripts/smoke.sh
      - name: Attack check (injector + probe + labeller, non-destructive)
        run: bash testbed/scripts/attack-check.sh
      - name: Dataset build (campaign -> label -> Parquet)
        working-directory: testbed
        run: |
          bash scripts/dataset-run.sh campaigns/quick.json
          # Assert the Parquet is non-empty and carries attack labels (checked in the
          # attacker container, which has pyarrow; the host runner does not).
          docker compose exec -T attacker python - <<'PY'
          import pyarrow.parquet as pq
          t = pq.read_table("/runs/quick/dataset.parquet")
          attack = sum(1 for v in t.column("is_attack").to_pylist() if v)
          print(f"dataset: {t.num_rows} rows, {attack} attack-labelled")
          assert t.num_rows > 0, "empty dataset"
          assert attack > 0, "no attack-labelled events -- labelling or capture broke"
          PY
      - name: Logs on failure
        if: failure()
        working-directory: testbed
        run: docker compose ps -a && docker compose logs --no-color --tail 200
      - name: Upload captures and probe events
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testbed-captures
          path: |
            testbed/captures/*.pcap
            testbed/events/*.jsonl
            testbed/runs/
          if-no-files-found: ignore
          retention-days: 7
      - name: Tear down
        if: always()
        working-directory: testbed
        run: docker compose down -v
