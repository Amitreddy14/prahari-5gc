[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "prahari-analytics"
version = "0.1.0"
description = "Detection, evaluation and triage for Prahari-5GC signalling events"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Amit Reddy" }]
dependencies = [
    "pydantic>=2.7,<3",
]

[project.optional-dependencies]
dataset = ["pyarrow>=16"]  # Parquet dataset build (prahari-dataset)
dev = [
    "pytest>=8",
    "jsonschema[format]>=4.22",
    "pyarrow>=16",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.scripts]
prahari-label = "prahari_analytics.labels:main"
prahari-dataset = "prahari_analytics.dataset:main"
prahari-detect = "prahari_analytics.detect.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/prahari_analytics"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "SIM", "RUF", "PL", "PT"]
ignore = ["PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603"]  # asserts; running the dev-built probe binary

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["prahari_analytics"]
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pyarrow.*"]
ignore_missing_imports = true
