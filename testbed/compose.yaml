# Prahari-5GC testbed: Open5GS v2.7.7 5G SA core + UERANSIM v3.2.8 gNB/UEs.
#
#   cd testbed && cp .env.example .env && docker compose up -d --build
#
# Addressing and ports: Architecture.md section 6. Every NF has a fixed IP so the
# probe can map IP -> network function. Nothing here publishes a host port.
#
# Start order matters: Kafka -> probe + capture -> NRF -> other NFs. The core keeps
# its HTTP/2 (SBI) connections open for its whole life, and HPACK can only be
# decoded from a connection's first byte, so the probe must be watching before the
# NFs connect. Restarting only the probe loses SBI decoding for connections that
# are already open (counted as prahari_probe_sbi_midstream_segments_total).

name: prahari

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

# Built once (by the nrf service below) and reused by every NF. Defining `build`
# here would make Compose compile Open5GS once per service, in parallel.
x-open5gs: &open5gs
  image: prahari/open5gs:2.7.7
  pull_policy: never
  restart: unless-stopped
  logging: *logging
  security_opt: ["no-new-privileges:true"]
  healthcheck: &sbi-health
    # Healthy once the NF's SBI server accepts TCP on :7777.
    test: ["CMD-SHELL", "nc -z $${NF_IP} 7777"]
    interval: 3s
    timeout: 2s
    retries: 20
    start_period: 3s

x-after-nrf: &after-nrf
  nrf: { condition: service_healthy }

services:
  mongo:
    image: mongo:6.0
    restart: unless-stopped
    logging: *logging
    command: ["--bind_ip", "172.22.0.30", "--quiet"]
    volumes: [mongo-data:/data/db]
    networks: { core: { ipv4_address: 172.22.0.30 } }
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--host", "172.22.0.30", "--eval", "db.adminCommand('ping').ok"]
      interval: 3s
      timeout: 3s
      retries: 30

  provision:
    image: mongo:6.0
    restart: "no"
    logging: *logging
    entrypoint: ["mongosh", "--quiet", "mongodb://172.22.0.30/open5gs", "/provision/provision.js"]
    environment:
      PRAHARI_UE_COUNT: ${PRAHARI_UE_COUNT:-10}
      PRAHARI_IMSI_BASE: ${PRAHARI_IMSI_BASE:-001010000000001}
      SUBSCRIBER_K: ${SUBSCRIBER_K:?set SUBSCRIBER_K in testbed/.env}
      SUBSCRIBER_OPC: ${SUBSCRIBER_OPC:?set SUBSCRIBER_OPC in testbed/.env}
    volumes: [./provision:/provision:ro]
    networks: { core: { ipv4_address: 172.22.0.31 } }
    depends_on: { mongo: { condition: service_healthy } }

  nrf:
    <<: *open5gs
    pull_policy: build
    build:
      context: ./docker
      dockerfile: open5gs.Dockerfile
      args: { BUILD_JOBS: "${BUILD_JOBS:-4}" }
    command: ["open5gs-nrfd", "-c", "/etc/open5gs/nrf.yaml"]
    environment: { NF_IP: 172.22.0.10 }
    volumes: [./open5gs/nrf.yaml:/etc/open5gs/nrf.yaml:ro]
    networks: { core: { ipv4_address: 172.22.0.10 } }
    # Every NF waits for the NRF, so this puts the probe in place before any SBI.
    depends_on:
      probe: { condition: service_started }
      capture: { condition: service_started }

  ausf:
    <<: *open5gs
    command: ["open5gs-ausfd", "-c", "/etc/open5gs/ausf.yaml"]
    environment: { NF_IP: 172.22.0.11 }
    volumes: [./open5gs/ausf.yaml:/etc/open5gs/ausf.yaml:ro]
    networks: { core: { ipv4_address: 172.22.0.11 } }
    depends_on: *after-nrf

  udm:
    <<: *open5gs
    command: ["open5gs-udmd", "-c", "/etc/open5gs/udm.yaml"]
    environment: { NF_IP: 172.22.0.12 }
    volumes: [./open5gs/udm.yaml:/etc/open5gs/udm.yaml:ro]
    networks: { core: { ipv4_address: 172.22.0.12 } }
    depends_on: *after-nrf

  udr:
    <<: *open5gs
    command: ["open5gs-udrd", "-c", "/etc/open5gs/udr.yaml"]
    environment: { NF_IP: 172.22.0.13 }
    volumes: [./open5gs/udr.yaml:/etc/open5gs/udr.yaml:ro]
    networks: { core: { ipv4_address: 172.22.0.13 } }
    depends_on:
      nrf: { condition: service_healthy }
      mongo: { condition: service_healthy }   # UDR exits at start-up without its DB

  pcf:
    <<: *open5gs
    command: ["open5gs-pcfd", "-c", "/etc/open5gs/pcf.yaml"]
    environment: { NF_IP: 172.22.0.14 }
    volumes: [./open5gs/pcf.yaml:/etc/open5gs/pcf.yaml:ro]
    networks: { core: { ipv4_address: 172.22.0.14 } }
    depends_on:
      nrf: { condition: service_healthy }
      mongo: { condition: service_healthy }   # PCF exits at start-up without its DB

  nssf:
    <<: *open5gs
    command: ["open5gs-nssfd", "-c", "/etc/open5gs/nssf.yaml"]
    environment: { NF_IP: 172.22.0.15 }
    volumes: [./open5gs/nssf.yaml:/etc/open5gs/nssf.yaml:ro]
    networks: { core: { ipv4_address: 172.22.0.15 } }
    depends_on: *after-nrf

  bsf:
    <<: *open5gs
    command: ["open5gs-bsfd", "-c", "/etc/open5gs/bsf.yaml"]
    environment: { NF_IP: 172.22.0.16 }
    volumes: [./open5gs/bsf.yaml:/etc/open5gs/bsf.yaml:ro]
    networks: { core: { ipv4_address: 172.22.0.16 } }
    depends_on: *after-nrf

  upf:
    <<: *open5gs
    user: root                       # needs to create ogstun and set NAT rules
    entrypoint: ["/usr/local/bin/upf-entrypoint.sh"]
    command: []
    environment: { NF_IP: 172.22.0.8, UE_POOL: 10.45.0.0/16, UE_GW: 10.45.0.1/16 }
    cap_add: [NET_ADMIN]
    devices: ["/dev/net/tun:/dev/net/tun"]
    sysctls: { net.ipv4.ip_forward: "1" }
    volumes: [./open5gs/upf.yaml:/etc/open5gs/upf.yaml:ro]
    networks: { core: { ipv4_address: 172.22.0.8 } }
    healthcheck:
      test: ["CMD-SHELL", "ip link show ogstun >/dev/null && pgrep -x open5gs-upfd >/dev/null"]
      interval: 3s
      timeout: 2s
      retries: 20

  smf:
    <<: *open5gs
    command: ["open5gs-smfd", "-c", "/etc/open5gs/smf.yaml"]
    environment: { NF_IP: 172.22.0.7 }
    volumes: [./open5gs/smf.yaml:/etc/open5gs/smf.yaml:ro]
    networks: { core: { ipv4_address: 172.22.0.7 } }
    depends_on:
      nrf: { condition: service_healthy }
      upf: { condition: service_healthy }

  amf:
    <<: *open5gs
    command: ["open5gs-amfd", "-c", "/etc/open5gs/amf.yaml"]
    environment: { NF_IP: 172.22.0.5 }
    volumes: [./open5gs/amf.yaml:/etc/open5gs/amf.yaml:ro]
    networks: { core: { ipv4_address: 172.22.0.5 } }
    depends_on:
      nrf: { condition: service_healthy }
      ausf: { condition: service_healthy }
      udm: { condition: service_healthy }
      udr: { condition: service_healthy }
      pcf: { condition: service_healthy }
      nssf: { condition: service_healthy }
      bsf: { condition: service_healthy }
      smf: { condition: service_healthy }

  gnb:
    image: prahari/ueransim:3.2.8
    pull_policy: build
    build:
      context: ./docker
      dockerfile: ueransim.Dockerfile
      args: { BUILD_JOBS: "${BUILD_JOBS:-4}" }
    restart: unless-stopped
    logging: *logging
    security_opt: ["no-new-privileges:true"]
    command: ["nr-gnb", "-c", "/etc/ueransim/gnb.yaml"]
    volumes: [./ueransim/gnb.yaml:/etc/ueransim/gnb.yaml:ro]
    networks: { core: { ipv4_address: 172.22.0.20 } }
    depends_on: { amf: { condition: service_healthy } }
    healthcheck:
      test: ["CMD-SHELL", "pgrep -x nr-gnb >/dev/null"]
      interval: 3s
      timeout: 2s
      retries: 20

  ue:
    image: prahari/ueransim:3.2.8   # built by the gnb service
    pull_policy: never
    restart: unless-stopped
    logging: *logging
    entrypoint: ["/usr/local/bin/ue-entrypoint.sh"]
    environment:
      PRAHARI_UE_COUNT: ${PRAHARI_UE_COUNT:-10}
      PRAHARI_IMSI_BASE: ${PRAHARI_IMSI_BASE:-001010000000001}
      SUBSCRIBER_K: ${SUBSCRIBER_K:?set SUBSCRIBER_K in testbed/.env}
      SUBSCRIBER_OPC: ${SUBSCRIBER_OPC:?set SUBSCRIBER_OPC in testbed/.env}
    cap_add: [NET_ADMIN]
    devices: ["/dev/net/tun:/dev/net/tun"]
    volumes: [./ueransim/ue.yaml.tmpl:/etc/ueransim/ue.yaml.tmpl:ro]
    networks: { core: { ipv4_address: 172.22.0.21 } }
    depends_on:
      gnb: { condition: service_healthy }
      provision: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD-SHELL", "ip link show uesimtun0 >/dev/null"]
      interval: 3s
      timeout: 2s
      retries: 40

  capture:
    image: prahari/capture:1
    pull_policy: build
    build:
      context: ./docker
      dockerfile: capture.Dockerfile
    restart: unless-stopped
    logging: *logging
    # Host network namespace = the Docker VM, where the prahari-core bridge lives.
    # A container on the bridge itself would only see its own traffic.
    network_mode: host
    cap_add: [NET_ADMIN, NET_RAW]
    volumes: [./captures:/captures]
    command:
      - tcpdump
      - -i
      - prahari-core
      - -n
      - -U                  # flush each packet so files are readable while open
      - -s
      - "0"
      - -Z
      - root
      - -G
      - "${CAPTURE_ROTATE_SECONDS:-600}"
      - -w
      - /captures/core-%Y%m%dT%H%M%S.pcap
      - sctp or (udp port 8805) or (tcp port 7777)

  # Event bus. Single-node KRaft (no ZooKeeper), on its own `obs` bridge: nothing on
  # the 5G core network (including the Phase 4 attack injector) can reach it. The
  # probe, in the host netns, reaches it through the bridge.
  # Not persistent by design: events/events.jsonl is the durable record.
  kafka:
    image: apache/kafka:3.9.1
    restart: unless-stopped
    logging: *logging
    networks: { obs: { ipv4_address: 172.23.0.10 } }
    environment:
      CLUSTER_ID: 1SDUGR2rXTCCWNiWWPVUTg   # fixed 16-byte base64 UUID (KRaft storage format)
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://172.23.0.10:9092,CONTROLLER://172.23.0.10:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://172.23.0.10:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@172.23.0.10:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"   # topics are created explicitly below
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx256m"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server 172.23.0.10:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 24
      start_period: 15s

  kafka-init:
    image: apache/kafka:3.9.1
    restart: "no"
    logging: *logging
    networks: { obs: { ipv4_address: 172.23.0.11 } }
    # 3 partitions keyed by UE pseudonym: each UE's events stay ordered.
    command:
      - /opt/kafka/bin/kafka-topics.sh
      - --bootstrap-server
      - 172.23.0.10:9092
      - --create
      - --if-not-exists
      - --topic
      - prahari.events.v1
      - --partitions
      - "3"
      - --replication-factor
      - "1"
      - --config
      - retention.ms=259200000
    depends_on: { kafka: { condition: service_healthy } }

  probe:
    image: prahari/probe:0.5.0
    pull_policy: build
    build:
      context: ../probe
      dockerfile: Dockerfile
    restart: unless-stopped
    logging: *logging
    # Same reasoning as capture: host netns sees all traffic on the prahari-core bridge.
    network_mode: host
    cap_drop: [ALL]
    cap_add: [NET_RAW, NET_ADMIN]   # raw capture + promiscuous mode, nothing else
    security_opt: ["no-new-privileges:true"]
    volumes: [./events:/events]
    environment:
      # HMAC key for SUPI pseudonyms. Unset or short: the probe omits SUPIs entirely.
      PRAHARI_SUPI_KEY: ${PRAHARI_SUPI_KEY:-}
    command:
      - run
      - --iface
      - prahari-core
      - --filter
      - "udp port 8805 or sctp or tcp port 7777"
      - --out
      - /events/events.jsonl
      - --kafka-brokers
      - 172.23.0.10:9092
      # Host network inside the Docker VM: Prometheus (Phase 8, on obs) scrapes 172.23.0.1:9464.
      - --metrics-listen
      - 0.0.0.0:9464
      - --stats
    depends_on: { kafka-init: { condition: service_completed_successfully } }

  # Attack injector (Phase 4). Only with: docker compose --profile attack up -d attacker
  # It sits at the address reserved for it (172.22.0.40) on the core network only:
  # it can reach NFs, never Kafka on obs. Root inside, but with every capability
  # dropped except NET_RAW (spoofed PFCP needs raw sockets).
  attacker:
    profiles: [attack]
    image: prahari/attacker:0.1.0
    pull_policy: build
    build:
      context: ..
      dockerfile: attacks/Dockerfile
    restart: "no"
    logging: *logging
    networks: { core: { ipv4_address: 172.22.0.40 } }
    cap_drop: [ALL]
    cap_add: [NET_RAW]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - ./runs:/runs              # manifests written here
      - ./events:/events:ro       # probe events, for labelling
    environment:
      PRAHARI_LAB: "1"

networks:
  obs:
    name: prahari-obs
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: prahari-obs
    ipam:
      config:
        - subnet: 172.23.0.0/24
          gateway: 172.23.0.1
  core:
    name: prahari-core
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: prahari-core
    ipam:
      config:
        - subnet: 172.22.0.0/24
          gateway: 172.22.0.1

volumes:
  mongo-data:
