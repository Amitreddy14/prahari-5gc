# Prahari-5GC testbed. Open5GS v2.7.7. Test PLMN 001/01.
# Addresses: see Architecture.md section 6. Logs go to stdout (no logger.file).
logger:
  level: info
global:
  max:
    ue: 1024

amf:
  sbi:
    server:
      - address: 172.22.0.5
        port: 7777
    client:
      nrf:
        - uri: http://172.22.0.10:7777
  ngap:
    server:
      - address: 172.22.0.5
  metrics:
    server:
      - address: 172.22.0.5
        port: 9090
  guami:
    - plmn_id:
        mcc: 001
        mnc: 01
      amf_id:
        region: 2
        set: 1
  tai:
    - plmn_id:
        mcc: 001
        mnc: 01
      tac: 1
  plmn_support:
    - plmn_id:
        mcc: 001
        mnc: 01
      s_nssai:
        - sst: 1
  security:
    integrity_order : [ NIA2, NIA1, NIA0 ]
    ciphering_order : [ NEA0, NEA1, NEA2 ]
  network_name:
    full: Prahari
    short: Prahari
  amf_name: prahari-amf0
  time:
    t3512:
      value: 540
